ointer}.btn:hover,.btn:focus-visible{background:#215477}.primary{background:#74dff2;color:#061827;border-color:#74dff2}.primary:hover{background:#b0f2ff}.bottom{padding-top:15px;border-top:1px solid #304458}.progress{height:3px;background:#2b465c;margin:10px 0 16px;border-radius:4px}.bar{height:100%;background:linear-gradient(90deg,#67e0ee,#9a8bff);width:4%;transition:width .2s}.qr{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:20px}.qr img{width:160px;height:160px;background:white;padding:8px;border-radius:12px}.qr a{overflow-wrap:anywhere;max-width:650px}.modal{position:fixed;inset:0;background:#030912ee;z-index:10;padding:25px;overflow:auto}.hidden{display:none}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:#12253a;border:1px solid #36516c;border-radius:14px;padding:18px;color:white;text-align:left;cursor:pointer}.tile:hover{border-color:#76deee}.tile span{color:#79dce9;font-size:12px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}@media(max-width:650px){.shell{padding:16px}.slide{min-height:520px}.content{padding:20px 0}.title{font-size:clamp(39px,11vw,58px)}.pill{display:none}.prompt pre{font-size:13px}.qr img{width:120px;height:120px}.bottom{gap:5px}.btn{padding:10px}}@media print{body{background:white;color:black}.top,.bottom,.actions,.modal{display:none!important}.slide{min-height:100vh;page-break-after:always}.title,.lead,.detail{color:black}.prompt{background:white;color:black}}
</style></head><body><div class="shell"><header class="top"><div class="brand">AI BOOTCAMP / UNIVERSITY OF TURBAT</div><div class="pill">19 NOV 2026 · INTERACTIVE WORKSHOP</div><button class="btn" id="overview">☷ All slides</button></header><main class="slide"><div class="content"><div class="eyebrow" id="tag"></div><h1 class="title" id="title"></h1><div class="lead" id="lead"></div><div class="detail" id="detail"></div><div id="extra"></div></div></main><div class="progress"><div class="bar" id="bar"></div></div><footer class="bottom"><span id="counter" class="small"></span><div class="actions"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next →</button></div></footer></div><section id="modal" class="modal hidden"><div class="modalhead"><h2>All slides</h2><button class="btn" id="close">Close ×</button></div><div class="tiles" id="tiles"></div></section><script>
const slides=[["WELCOME","AI Bootcamp 2026","From better prompts to real AI automation","Learn • Try • Build • Share",""],["MEET YOUR SPEAKER","Shah Bakhsh","Computer Science student · AI & NLP builder","Working on Balochi-language AI, agents, and practical automation. Explore the projects and connect on LinkedIn.",""],["THE ROADMAP","What we'll build today","Prompt Engineering → Context Engineering → RAG → Agents → Google AI tools → Zapier","Every topic includes a practical challenge. Open this deck on your phone to copy prompts.",""],["FOUNDATIONS","What is Generative AI?","AI that creates new text, images, audio, code, and more","It predicts useful outputs from patterns learned during training. Always verify important facts.",""],["PROMPT ENGINEERING","A prompt is your instruction","Goal + context + constraints + output format","Weak: “Explain AI.” Strong: “Explain AI to a first-year student using three everyday examples in 120 words.”","Explain AI to a first-year student using three everyday examples. Use simple English, at most 120 words, and finish with one quiz question."],["ZERO-SHOT","Zero-shot prompting","Ask without giving an example","Challenge: Ask the model to classify the sentiment of a message without showing any sample answer.","Classify this feedback as Positive, Neutral, or Negative. Reply with only the label: 'The workshop was useful and easy to follow.'"],["ONE-SHOT","One-shot prompting","Show one example, then ask","Challenge: Notice how one sample teaches the desired answer format.","Example: 'I loved the session' → Positive. Now classify: 'The session was confusing' →"],["FEW-SHOT","Few-shot prompting","Show several examples to establish a pattern","Challenge: Compare the answer with zero-shot and one-shot results.","Classify sentiment.\n'I loved it' → Positive\n'It was okay' → Neutral\n'I disliked it' → Negative\n'Excellent practical examples' →"],["PROMPT IMPROVEMENT","Make prompts more reliable","Specify audience, role, task, limits, and structure","Challenge: Revise a vague prompt, then compare both answers side by side.","You are a patient tutor. Teach me cloud computing as a beginner. Use one analogy, three key ideas, and a two-question quiz. Avoid jargon."],["CONTEXT ENGINEERING","Prompt vs. context","Prompt = the request. Context = the relevant information supplied to fulfill it.","Useful context includes goals, documents, past messages, constraints, and source material. Avoid sharing private data.","I am a first-year CS student preparing a 2-minute talk. My audience has never used AI. Explain RAG in simple English with a library analogy and a 30-second example."],["CONTEXT CHALLENGE","Give the AI the right background","Compare an answer with and without relevant context","Challenge: Paste your own non-sensitive course outline and ask for a tailored study plan.","Use this context: I have 5 days, 45 minutes daily, and know basic Python. Create a beginner plan to learn AI agents. Include daily tasks and one mini-project."],["RAG","Retrieval-Augmented Generation","Retrieve relevant documents → add them to the prompt → generate a grounded answer","A library analogy: first find the right book, then answer using that book. RAG can still make mistakes; check citations.","Explain Retrieval-Augmented Generation using a university library analogy. Compare it with answering from memory in a 2-column table."],["RAG ACTIVITY","Ask questions from your own notes","Use a short source passage, then demand evidence","Challenge: Paste a non-private paragraph from your notes and ask for a sourced answer.","Answer ONLY using the passage below. If the answer is missing, say 'Not found in the passage'. Quote the exact sentence that supports your answer.\nPASSAGE: [paste your course notes]\nQUESTION: What are the key ideas?"],["AI AGENTS","From chatbots to AI agents","An agent can plan steps, use tools, observe results, and continue toward a goal","An agent still needs permissions, safety limits, and human review for important actions.","Design a safe AI agent that helps students plan a study week. List its goal, tools, inputs, actions, and where human approval is required."],["AUTOMATION","Automation vs. AI agents","Automation follows a predefined workflow; agents can choose steps based on context","Example: Form submission → spreadsheet row → email. This is automation, even if an AI step is added.","Create a simple workflow for workshop registration: Google Form → Google Sheets → email confirmation. Explain each step for beginners."],["GOOGLE AI","Gemini: everyday AI assistant","Brainstorm, summarize, explain, and draft","Challenge: Open Gemini and compare how it responds to your best prompt.","Act as a career advisor for a new CS graduate. Ask me 4 questions, then write a concise, ATS-friendly resume summary based ONLY on my answers. Do not invent achievements."],["RESUME LAB","Create a truthful resume","Provide verified skills, education, and experience","Challenge: Ask AI to format your own facts. Review every claim before using it.","Create a one-page ATS-friendly resume from the details below. Do not invent facts. If something is missing, mark it [ADD DETAIL].\nEducation: [your education]\nSkills: [your skills]\nProjects: [your projects]\nExperience: [your experience]"],["NOTEBOOKLM","NotebookLM: learn from sources","Add permitted documents, ask questions, and explore source-grounded summaries","Challenge: Upload your own lecture notes, ask for five questions, and check the citations.","Using only my uploaded notes, create 5 beginner-friendly quiz questions with answers. Cite the relevant source section for each."],["GOOGLE FLOW","AI video creation with Flow","Describe subject, setting, camera movement, action, and mood","Access and available features may depend on your account and region. Challenge: try a short original scene.","Cinematic 8-second video: a student opens a notebook in a sunlit university library, gentle camera push-in, realistic lighting, calm hopeful mood, no logos, no text, no identifiable real people."],["AUDIO & MUSIC","Create original audio","Specify genre, instruments, tempo, duration, and purpose","Use a music-generation tool available to you. Avoid requesting copyrighted melodies or artist imitation.","Create an original 15-second instrumental intro for a university AI workshop: upbeat, warm synths and soft percussion, medium tempo, no vocals, no copyrighted melody."],["CREATIVE CHALLENGE","Build a mini AI campaign","Use AI for a headline, poster concept, video idea, and music brief","Work in pairs: 5 minutes to create; 1 minute to present. Label AI-generated content clearly.","Plan a responsible AI workshop campaign for university students. Give me a headline, 30-word invitation, 8-second original video prompt, and 15-second original music brief."],["ZAPIER","Zapier: connect apps without coding","Trigger → action → result","Our real demo: Google Form → Google Sheets → Zapier → Gmail attendance confirmation.","Explain Zapier triggers and actions with a university attendance example. Include a 4-step workflow and one common mistake."],["LIVE DEMO","Watch the automation run","1. Submit attendance form  2. Sheet receives a row  3. Zap runs  4. Gmail sends confirmation","The test has already worked. A new response may take a few minutes to process.",""],["ATTENDANCE","Scan to record your attendance","Open the form, submit your details, then check your inbox","Your email confirmation is sent by the Zapier workflow. Do not submit duplicate responses unnecessarily.",""],["CLOSING","Your next step starts today","Write a better prompt. Add the right context. Verify outputs. Automate one useful task.","Thank you • University of Turbat • 19 November 2026",""]];const form="https://docs.google.com/forms/d/e/1FAIpQLScfzEzgYwAPpayLF27-M8ivG-axc6S2gQjHh3_g4lesVBavFQ/viewform",repo="https://github.com/shah-bakhsh/AIBootcamp",formQR="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=16&data=https%3A%2F%2Fdocs.google.com%2Fforms%2Fd%2Fe%2F1FAIpQLScfzEzgYwAPpayLF27-M8ivG-axc6S2gQjHh3_g4lesVBavFQ%2Fviewform",repoQR="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=16&data=https%3A%2F%2Fgithub.com%2Fshah-bakhsh%2FAIBootcamp";let i=0;
const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let s=slides[i];el('tag').textContent=s[0];el('title').textContent=s[1];el('lead').textContent=s[2];el('detail').textContent=s[3];let e=el('extra');e.innerHTML='';if(s[4]){let box=document.createElement('div');box.className='prompt';box.innerHTML='<div class="small">TRY IT YOURSELF · COPY & PASTE</div><pre>'+esc(s[4])+'</pre><div class="actions"><button class="btn primary" id="copy">Copy prompt</button></div>';e.append(box);el('copy').onclick=()=>navigator.clipboard.writeText(s[4]).then(()=>{el('copy').textContent='Copied ✓'}).catch(()=>{let ta=document.createElement('textarea');ta.value=s[4];document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();el('copy').textContent='Copied ✓'})}if(i===0||i===23){let target=i===0?repo:form;let img=i===0?repoQR:formQR;let label=i===0?'Presentation source / share after deployment':'Attendance form';let d=document.createElement('div');d.className='qr';d.innerHTML='<img src="'+img+'" alt="QR code"><div><div class="small">'+label+'</div><a href="'+target+'" target="_blank" rel="noopener">'+esc(target)+'</a><div class="detail" style="font-size:14px;margin-top:8px">'+(i===0?'This QR currently opens the GitHub repository. Replace with your live Vercel URL after deployment.':'Scan with your phone camera and complete the form.')+'</div></div>';e.append(d)}if(i===1){let d=document.createElement('div');d.className='actions';d.innerHTML='<a class="btn" href="https://www.linkedin.com/in/shah-bakhsh/" target="_blank" rel="noopener">LinkedIn ↗</a><a class="btn" href="https://github.com/shah-bakhsh" target="_blank" rel="noopener">GitHub ↗</a>';e.append(d)}el('counter').textContent=String(i+1).padStart(2,'0')+' / '+slides.length;el('bar').style.width=((i+1)/slides.length*100)+'%';el('prev').disabled=i===0;el('next').textContent=i===slides.length-1?'Back to start ↺':'Next →';history.replaceState(null,'','#slide-'+(i+1))}
function go(n){i=Math.max(0,Math.min(slides.length-1,n));render()}el('prev').onclick=()=>go(i-1);el('next').onclick=()=>go(i===slides.length-1?0:i+1);el('overview').onclick=()=>el('modal').classList.remove('hidden');el('close').onclick=()=>el('modal').classList.add('hidden');el('tiles').innerHTML=slides.map((s,j)=>'<button class="tile" data-n="'+j+'"><span>'+String(j+1).padStart(2,'0')+' / '+esc(s[0])+'</span><h3>'+esc(s[1])+'</h3></button>').join('');el('tiles').onclick=e=>{let b=e.target.closest('[data-n]');if(b){go(+b.dataset.n);el('modal').classList.add('hidden')}};document.addEventListener('keydown',e=>{if(!el('modal').classList.contains('hidden')){if(e.key==='Escape')el('modal').classList.add('hidden');return}if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}});let m=location.hash.match(/slide-(\d+)/);if(m)i=Math.min(slides.length-1,Math.max(0,+m[1]-1));render();
</script></body></html>
